<VirtualHost *:80>

  ServerName api.domain.com

  ProxyPreserveHost On
  ProxyPass / http://localhost:8000/
  ProxyPassReverse / http://localhost:8000/

  <FilesMatch "^\.">
    Order allow,deny
    Deny from all
    Satisfy All
  </FilesMatch>

  ErrorLog ${APACHE_LOG_DIR}/api-error.log
  CustomLog ${APACHE_LOG_DIR}/api-access.log combined

</VirtualHost>
