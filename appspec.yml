# node.js appspec.yml

version: 0.0
os: linux
files:
    - source: /
      destination: /var/www/html
      overwrite: true
file_exists_behavior: OVERWRITE

hooks:
    AfterInstall:
        - location: scripts/afterinstall.sh
          timeout: 100
          runas: ubuntu
          
    ApplicationStart:
        - location: scripts/applicationstart.sh
          timeout: 100
          runas: ubuntu
