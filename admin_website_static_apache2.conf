<VirtualHost *:80>

  ServerAdmin admin@example.com
  ServerName domain.com
  ServerAlias www.domain.co

  DocumentRoot /var/www/html/website

  <Directory /var/www/html/website>
    Options -Indexes +FollowSymLinks +MultiViews
    AllowOverride All
    Require all granted

    # Block access to specific files (e.g., database.js, database.php)
    <FilesMatch "^(database\.js|database\.php)$">
      Order allow,deny
      Deny from all
    </FilesMatch>

    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    <FilesMatch "^\.">
      Order allow,deny
      Deny from all
      Satisfy All
    </FilesMatch>

  </Directory>

  # Add security headers
  <IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
  </IfModule>

  ErrorLog ${APACHE_LOG_DIR}/website-error.log
  CustomLog ${APACHE_LOG_DIR}/website-access.log combined

  RewriteEngine On
  RewriteCond %{HTTP_HOST} ^65\.2\.102\.2$
  RewriteRule ^(.*)$ https://www.domain.com$1 [L,R=301]

</VirtualHost>
